name: Keep-Alive Cron Pipeline

on:
  schedule:
    - cron: '0 0 */3 * *' # Chạy mỗi 3 ngày một lần
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          URL="${{ secrets.APP_URL }}/api/health"
          echo "Pinging $URL..."
          curl -s -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL"

