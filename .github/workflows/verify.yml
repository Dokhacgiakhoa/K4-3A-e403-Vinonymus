name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase
    env:
      # Hook git chỉ dùng trên máy dev, CI không cần cài
      HUSKY: 0
      # Giá trị giả để build không vỡ khi thiếu Supabase; không phải key thật
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codebase/package-lock.json
      - run: npm ci
      - run: npm run verify

  # Backend .NET: build + toàn bộ test (Domain, Application, tích hợp HTTP).
  # Không cần Postgres: test tích hợp thay database bằng bản trong bộ nhớ.
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/backend-core
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AIIANotebook.slnx
      # Cảnh báo cũng tính là lỗi, để code mới không tích luỹ cảnh báo.
      - run: dotnet build AIIANotebook.slnx --no-restore -c Release -warnaserror
      - run: dotnet test AIIANotebook.slnx --no-build -c Release --logger "console;verbosity=normal"
